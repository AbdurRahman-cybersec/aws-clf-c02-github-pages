<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img" aria-labelledby="title desc">
  <title id="title">AWS CLI visual study guide</title>
  <desc id="desc">Definition, decision diagram, worked example, exam trigger words, and comparison for AWS CLI.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1"><stop stop-color="#0b2a67"/><stop offset="1" stop-color="#1457c5"/></linearGradient>
    <linearGradient id="bluePanel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eff8ff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <linearGradient id="greenPanel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0fdf4"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17315c" flood-opacity=".13"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#16803c"/></marker>
  </defs>
  <rect width="1400" height="940" fill="#f8fbff"/>
  <rect x="0" y="0" width="1400" height="142" fill="#0b2a67"/>
  <circle cx="74" cy="67" r="39" fill="#ffb000"/><path d="M55 65h38M74 46v38M61 52l26 26M87 52L61 78" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  <text x="132" y="65" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="900" text-anchor="start"><tspan x="132" dy="0">AWS CLI</tspan></text>
  <rect x="1080" y="46" width="262" height="46" rx="23" fill="#dbeafe" stroke="#ffffff" stroke-opacity=".8"/>
  <text x="1211" y="76" fill="#0b2a67" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="900" text-anchor="middle" letter-spacing=".7">DEVELOPER TOOLS</text>

  <g filter="url(#shadow)">
    <rect x="40" y="174" width="365" height="525" rx="24" fill="#f3f9ff" stroke="#1670d2" stroke-width="3"/>
    <rect x="428" y="174" width="526" height="525" rx="24" fill="#ffffff" stroke="#173f91" stroke-width="3"/>
    <rect x="977" y="174" width="383" height="525" rx="24" fill="#f2fcf5" stroke="#20933e" stroke-width="3"/>
  </g>

  <circle cx="92" cy="226" r="31" fill="#dbeafe"/><path d="M77 209h29v37H77zM82 216h19M82 223h19M82 230h14" fill="none" stroke="#1357b4" stroke-width="4" stroke-linecap="round"/>
  <text x="137" y="235" fill="#124a9c" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="900">1. DEFINITION</text>
  <line x1="68" y1="267" x2="377" y2="267" stroke="#61a5ee" stroke-width="2" stroke-dasharray="9 8"/>
  <text x="68" y="316" fill="#172554" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="570" text-anchor="start"><tspan x="68" dy="0">Command-line interface for</tspan><tspan x="68" dy="34">managing AWS services. Best</tspan><tspan x="68" dy="34">when the requirement is to</tspan><tspan x="68" dy="34">script or automate AWS</tspan><tspan x="68" dy="34">operations from a terminal.</tspan></text>

  <text x="691" y="229" fill="#173f91" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900" text-anchor="middle">2. HOW TO CHOOSE IT</text>
  <line x1="462" y1="254" x2="920" y2="254" stroke="#8eb7ee" stroke-width="2"/>
  <rect x="479" y="293" width="424" height="145" rx="18" fill="#fff7dd" stroke="#e6a600" stroke-width="2"/>
  <text x="501" y="323" fill="#9a5a00" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="900" letter-spacing="1">EXAM REQUIREMENT</text>
  <text x="501" y="352" fill="#3b2a0a" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="501" dy="0">Script or automate AWS</tspan><tspan x="501" dy="25">operations from a terminal.</tspan></text>
  <path d="M691 445v20" stroke="#16803c" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="513" y="465" width="356" height="91" rx="46" fill="#1558c0"/>
  <text x="691" y="510" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="900" text-anchor="middle"><tspan x="691" dy="0">AWS CLI</tspan></text>
  <path d="M691 568v41" stroke="#16803c" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="479" y="619" width="424" height="58" rx="16" fill="#dcfce7" stroke="#2b9a4b" stroke-width="2"/>
  <text x="691" y="651" fill="#166534" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="middle"><tspan x="691" dy="0">The requirement is met</tspan><tspan x="691" dy="21">with AWS CLI.</tspan></text>

  <circle cx="1029" cy="226" r="31" fill="#dcfce7"/><path d="M1014 226l10 10 21-25" fill="none" stroke="#19833b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1070" y="235" fill="#177334" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="900">3. EXAMPLE</text>
  <line x1="1007" y1="267" x2="1331" y2="267" stroke="#65bc7b" stroke-width="2" stroke-dasharray="9 8"/>
  <rect x="1007" y="290" width="323" height="186" rx="17" fill="#ffffff" stroke="#86d29a" stroke-width="2"/>
  <text x="1028" y="322" fill="#177334" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="900" letter-spacing="1">WORKED SCENARIO</text>
  <text x="1028" y="356" fill="#17301f" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="start"><tspan x="1028" dy="0">Script or automate AWS</tspan><tspan x="1028" dy="27">operations from a terminal.</tspan></text>
  <rect x="1007" y="495" width="323" height="177" rx="17" fill="#eaf8ef"/>
  <text x="1028" y="527" fill="#177334" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="900" letter-spacing="1">WHY THIS FITS</text>
  <text x="1028" y="561" fill="#17301f" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="650" text-anchor="start"><tspan x="1028" dy="0">Calls AWS APIs from shell</tspan><tspan x="1028" dy="26">commands and is well suited</tspan><tspan x="1028" dy="26">to scripts and automation.</tspan></text>

  <rect x="40" y="728" width="1320" height="111" rx="22" fill="#ffffff" stroke="#7952c7" stroke-width="3"/>
  <text x="64" y="755" fill="#6333b0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900">4. EXAM TRIGGER WORDS</text>
  <rect x="58" y="761" width="186" height="54" rx="27" fill="#e0f2fe" stroke="#075985" stroke-opacity=".22"/><text x="151" y="795" fill="#075985" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle">command line</text><rect x="262" y="761" width="162" height="54" rx="27" fill="#dcfce7" stroke="#166534" stroke-opacity=".22"/><text x="343" y="795" fill="#166534" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle">script AWS</text><rect x="442" y="761" width="270" height="54" rx="27" fill="#f3e8ff" stroke="#6b21a8" stroke-opacity=".22"/><text x="577" y="795" fill="#6b21a8" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle">programmatic access</text>

  <rect x="40" y="857" width="855" height="61" rx="18" fill="#fff2e7" stroke="#ee781c" stroke-width="2"/>
  <text x="65" y="883" fill="#c14e08" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900">DO NOT CONFUSE WITH</text>
  <text x="238" y="882" fill="#51270d" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start"><tspan x="238" dy="0">SDK; CLI is shell use, SDK is embedded in application code.</tspan></text>
  <rect x="915" y="857" width="445" height="61" rx="18" fill="#e8f2ff" stroke="#2673cc" stroke-width="2"/>
  <circle cx="949" cy="887" r="18" fill="#ffb000"/><path d="M941 887l6 6 12-15" fill="none" stroke="#173f91" stroke-width="4" stroke-linecap="round"/>
  <text x="978" y="883" fill="#173f91" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900">BOTTOM LINE</text>
  <text x="978" y="904" fill="#172554" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Match the requirement to this service&apos;s role.</text>
</svg>